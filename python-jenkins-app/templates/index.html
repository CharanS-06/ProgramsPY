<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Python CI/CD Deployment</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Python Application Deployment</h1>

            <p class="subtitle">
                Deployed using Jenkins, Docker, and AWS EC2
            </p>

            <div class="status">
                <span class="status-indicator"></span>
                Application is running
            </div>

            <div class="details">

                <div class="detail-item">
                    <span class="label">Application</span>
                    <span class="value">Python Flask</span>
                </div>

                <div class="detail-item">
                    <span class="label">Deployment Environment</span>
                    <span class="value">{{ environment }}</span>
                </div>

                <div class="detail-item">
                    <span class="label">Container Hostname</span>
                    <span class="value">{{ hostname }}</span>
                </div>

            </div>

            <a href="/health" class="button">
                Check Application Health
            </a>

        </div>

        <footer>
            <p>Automated CI/CD deployment with Jenkins</p>
        </footer>

    </div>

</body>
</html>
